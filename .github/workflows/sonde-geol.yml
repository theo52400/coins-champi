name: Sonde géologie BRGM
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/geol/probe.sh', '.github/workflows/sonde-geol.yml']
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Installer GDAL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin
      - name: Sonder
        run: bash tools/geol/probe.sh > /tmp/probe.log 2>&1 || true
      - name: Publier le journal sur la branche sondes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin sondes || true
          git switch -q sondes 2>/dev/null || git switch -q --orphan sondes
          git rm -rq --cached . 2>/dev/null || true
          cp /tmp/probe.log geol-probe.log
          git add geol-probe.log && git commit -qm "Sonde géologie BRGM" && git push -q origin sondes
