name: Sonde catalogue
on:
  push:
    branches: [sonde-catalogue]
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Candidats photos
        run: |
          mkdir -p /tmp/ph && cd /tmp/ph && npm init -y >/dev/null && npm i -s sharp@0.33.5 >/dev/null && cd - >/dev/null
          cp candidats.mjs /tmp/ph/ && node /tmp/ph/candidats.mjs especes_nouv.json /tmp/out || true
      - name: Publier
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin sondes && git switch -q sondes
          rm -rf photos-nouv && mkdir photos-nouv && cp -r /tmp/out/* photos-nouv/
          git add -A photos-nouv && git commit -qm "Candidats photos (nouvelles fiches)" && git push -q origin sondes
