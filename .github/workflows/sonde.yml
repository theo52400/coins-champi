name: Sonde catalogue
on:
  push:
    branches: [sonde-catalogue]
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sonder
        run: mkdir -p out && node sonde.mjs || true
      - name: Publier
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r out /tmp/out
          git fetch -q origin sondes && git switch -q sondes
          rm -rf catalogue && mkdir catalogue && cp -r /tmp/out/* catalogue/
          git add -A catalogue && git commit -qm "Sonde catalogue" && git push -q origin sondes
