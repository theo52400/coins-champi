name: Météo de pousse (France)
# Chaque matin : pluie et températures des 3 dernières semaines sur toute la France (un point tous les 0,5°, Open-Meteo),
# pour la carte « Ça pousse » vue de loin. Écrit data/meteo/pousse.json sur main (le site publié se met à jour).
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
  push:
    branches: [main]
    paths: ['tools/meteo/**', '.github/workflows/meteo-france.yml']
permissions:
  contents: write
concurrency:
  group: meteo-france
  cancel-in-progress: false
jobs:
  meteo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Calculer
        run: node tools/meteo/pousse.mjs data/meteo/pousse.json
      - name: Enregistrer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meteo/pousse.json
          git diff --cached --quiet && exit 0
          git commit -qm "Météo de pousse du $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && exit 0; sleep 5; done
          exit 1
