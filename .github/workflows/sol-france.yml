name: Données de sol (France)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/sol/**', '.github/workflows/sol-france.yml']
permissions:
  contents: write
concurrency:
  group: sol-france
  cancel-in-progress: true
jobs:
  sol:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Installer GDAL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin python3-gdal python3-numpy
      - name: Extraire pH et argile sur la France
        run: set -o pipefail; bash tools/sol/build.sh 2>&1 | tee tools/sol/build.log
      - name: Enregistrer les tuiles et le journal
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/sol tools/sol/build.log
          git commit -m "Données de sol France (SoilGrids, pH et argile)" || echo "rien à enregistrer"
          git pull --rebase -q || true
          git push
